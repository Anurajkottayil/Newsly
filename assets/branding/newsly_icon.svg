<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient: Deep Indigo to Space Navy -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Accent Gradient: Electric Blue -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Paper Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#050B14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGradient)"/>

  <!-- Centered Artwork Container (Within 66% safe zone: 675x675) -->
  <g filter="url(#dropShadow)">
    <!-- Main Newspaper Body -->
    <!-- Dimensions: 440 x 540, positioned from x=292, y=242 -->
    <path d="M 332 242 
             L 642 242 
             L 732 332 
             L 732 742 
             A 40 40 0 0 1 692 782 
             L 332 782 
             A 40 40 0 0 1 292 742 
             L 292 282 
             A 40 40 0 0 1 332 242 Z" 
          fill="#FFFFFF"/>

    <!-- Folded Top-Right Corner -->
    <path d="M 642 242 
             L 642 302 
             A 30 30 0 0 0 672 332 
             L 732 332 Z" 
          fill="#E2E8F0"/>

    <!-- Corner Fold Crease Shadow -->
    <path d="M 642 242 
             L 732 332 
             L 642 332 Z" 
          fill="#CBD5E1" opacity="0.5"/>

    <!-- Category / Live News Pill Badge -->
    <rect x="344" y="294" width="108" height="28" rx="14" fill="url(#accentGradient)"/>

    <!-- Hero Image / Visual Media Block -->
    <rect x="344" y="344" width="336" height="172" rx="20" fill="url(#accentGradient)"/>

    <!-- Geometric Tech / Horizon Accent inside media block -->
    <circle cx="580" cy="400" r="28" fill="#FFFFFF" opacity="0.35"/>
    <path d="M 344 480 
             C 410 430, 470 450, 520 420 
             C 570 390, 620 440, 680 430 
             L 680 496 
             A 20 20 0 0 1 660 516 
             L 364 516 
             A 20 20 0 0 1 344 496 Z" 
          fill="#1E3A8A" opacity="0.4"/>

    <!-- Bold Headline Bar -->
    <rect x="344" y="548" width="280" height="32" rx="16" fill="#0F172A"/>

    <!-- Article Story Line 1 -->
    <rect x="344" y="604" width="336" height="22" rx="11" fill="#64748B"/>

    <!-- Article Story Line 2 -->
    <rect x="344" y="644" width="336" height="22" rx="11" fill="#94A3B8"/>

    <!-- Article Story Line 3 (Indented short line) -->
    <rect x="344" y="684" width="210" height="22" rx="11" fill="#CBD5E1"/>

    <!-- Subtle Blue Editorial Bookmark / Accent Tag at Bottom-Right -->
    <circle cx="650" cy="695" r="16" fill="#2563EB"/>
  </g>
</svg>
